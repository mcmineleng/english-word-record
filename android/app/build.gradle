plugins {
    id 'com.android.application'
}

android {
    namespace 'cn.mcleng.mineleng.english.word'
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "cn.mcleng.mineleng.english.word"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation "androidx.webkit:webkit:1.10.0"
}

// ---- 网页资源同步任务（配置缓存安全版）----
def webDirProvider = layout.projectDirectory.dir('../../web')
def assetsDirProvider = layout.projectDirectory.dir('src/main/assets')

// 用 Sync 类型：会自动清理目标目录中不再存在的文件，替代手写 deleteDir
tasks.register('syncWebToAssets', Sync) {
    from(webDirProvider)
    into(assetsDirProvider)

    doFirst {
        if (!webDirProvider.asFile.exists()) {
            throw new GradleException("网页资源目录不存在，拷贝失败！")
        }
    }

    // 确保任务在有变化时才运行
    outputs.upToDateWhen { true }
}

// ---- 让所有 merge*Assets / assemble / bundle 任务依赖 sync ----
// 关键：mergeXxxAssets 读取 assets，必须显式声明依赖
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }.configureEach {
    dependsOn('syncWebToAssets')
}

tasks.matching { it.name == 'assembleRelease' || it.name == 'assembleDebug' 
             || it.name == 'bundleRelease' || it.name == 'bundleDebug' }.configureEach {
    dependsOn('syncWebToAssets')
}