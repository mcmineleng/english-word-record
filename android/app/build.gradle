plugins {
    id 'com.android.application'
}

android {
    namespace 'cn.mcleng.mineleng.english.word'
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "cn.mcleng.mineleng.english.word"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation "androidx.webkit:webkit:1.10.0"
}

// ---- 网页资源同步任务（配置缓存安全版）----
def webDirProvider = layout.projectDirectory.dir('../../web')
def assetsDirProvider = layout.projectDirectory.dir('src/main/assets')

tasks.register('syncWebToAssets') {
    // 用 Provider 在配置阶段锁定路径，执行阶段不再引用 Project
    inputs.dir(webDirProvider)
    outputs.dir(assetsDirProvider)

    doLast {
        def webDir = webDirProvider.asFile
        def assetsDir = assetsDirProvider.asFile

        if (!webDir.exists() || !webDir.isDirectory()) {
            throw new GradleException("网页资源目录不存在，拷贝失败！")
        }

        // 清空 assets（整目录删除后重建，避免 fileTree 触发配置缓存问题）
        if (assetsDir.exists()) {
            assetsDir.deleteDir()
        }
        assetsDir.mkdirs()

        // 平铺复制：用 project.copy，闭包内不访问 fileTree / ant
        project.copy {
            from(webDir)
            into(assetsDir)
        }
        println "网页资源拷贝完成"
    }
}

// ---- 让 assemble / bundle / build 依赖该任务 ----
tasks.whenTaskAdded { t ->
    if (t.name.matches(/(assemble|bundle).*|build/)) {
        t.dependsOn syncWebToAssets
    }
}