name: Build Release APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g"

jobs:
  build:
    runs-on: ubuntu-latest

    # 👇 所有步骤默认在 android/ 下执行
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # 官方 Gradle 缓存：main 写回，PR 只读
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # 缓存键带 android/ 子工程标识，避免和其他平台混
          gradle-home-cache-key-prefix: android
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-cleanup: on-success

      - name: Build release APK (real key if secrets exist)
        run: |
          ARGS=()
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            ARGS+=(
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.p12"
              -Pandroid.injected.signing.store.password="$RELEASE_STORE_PASSWORD"
              -Pandroid.injected.signing.key.alias="$RELEASE_KEY_ALIAS"
              -Pandroid.injected.signing.key.password="$RELEASE_KEY_PASSWORD"
            )
            echo "::notice ::Using REAL release signing key"
          else
            echo "::warning ::No release key secret found, signing with android/public.p12 (NOT TRUSTED)"
            ARGS+=(
              -Pandroid.injected.signing.store.file="public.p12"
              -Pandroid.injected.signing.store.password="changeit"
              -Pandroid.injected.signing.key.alias="public"
              -Pandroid.injected.signing.key.password="changeit"
            )
          fi

          ./gradlew assembleRelease "${ARGS[@]}"

        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Show APK cert fingerprint
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          keytool -printcert -jarfile "$APK" | grep -E "SHA256|SHA1|Owner" || true

      - name: Upload release APK
        uses: actions/upload-artifact@v5
        with:
          name: app-release-apk
          # ⚠️ upload-artifact 不继承 working-directory，要写全路径
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
