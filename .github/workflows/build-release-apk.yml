name: Build Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-key-prefix: android
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-cleanup: on-success

      - name: Build release APK (real key if ALL secrets exist)
        run: |
          ARGS=()
          if [ -n "$RELEASE_KEYSTORE_B64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] \
             && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            if [ ! -s "$RUNNER_TEMP/release.p12" ]; then
              echo "::error ::Decoded keystore is empty — check RELEASE_KEYSTORE_B64"
              exit 1
            fi
            ARGS+=(
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.p12"
              -Pandroid.injected.signing.store.password="$RELEASE_STORE_PASSWORD"
              -Pandroid.injected.signing.key.alias="$RELEASE_KEY_ALIAS"
              -Pandroid.injected.signing.key.password="$RELEASE_KEY_PASSWORD"
            )
            echo "::notice ::Using REAL release signing key"
          else
            missing=""
            [ -z "$RELEASE_KEYSTORE_B64" ]   && missing+=" RELEASE_KEYSTORE_B64"
            [ -z "$RELEASE_STORE_PASSWORD" ] && missing+=" RELEASE_STORE_PASSWORD"
            [ -z "$RELEASE_KEY_ALIAS" ]      && missing+=" RELEASE_KEY_ALIAS"
            [ -z "$RELEASE_KEY_PASSWORD" ]   && missing+=" RELEASE_KEY_PASSWORD"
            echo "::warning ::Missing secret(s):${missing:- none-but-empty} → falling back to public.p12 (NOT TRUSTED)"
            ARGS+=(
              -Pandroid.injected.signing.store.file="public.p12"
              -Pandroid.injected.signing.key.alias="public"
              -Pandroid.injected.signing.store.password="public"
              -Pandroid.injected.signing.key.password="public"
            )
          fi

          # 不用 ./gradlew（避免 Permission denied），改用 bash 调用
          bash gradlew assembleRelease "${ARGS[@]}"
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Show APK cert fingerprint
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          keytool -printcert -jarfile "$APK" | grep -E "SHA256|SHA1|Owner" || true

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
